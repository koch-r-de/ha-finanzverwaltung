name: "Private Finanzverwaltung"
version: "2.7"
slug: "finanzverwaltung"
description: "Private Finanzverwaltung mit Konten, Budgets, Darlehen und Auswertungen"
url: "https://github.com/koch-r-de/ha-finanzverwaltung"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-multiple
panel_title: Finanzen
panel_admin: false
# herkunft_pruefen (seit 2.6.2, Befund Q): protokoll = nur mitschreiben,
# sperren = fremde Zugriffe im internen Netz abweisen, aus = keine Prüfung
options:
  herkunft_pruefen: protokoll
schema:
  herkunft_pruefen: list(aus|protokoll|sperren)?
